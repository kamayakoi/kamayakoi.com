name: Update Expired Payments

on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-expired-payments
  cancel-in-progress: false

jobs:
  update-expired-payments:
    name: Call expire-payments RPC
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: RPC update_expired_pending_payments
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          status="$(curl -sS -o /tmp/rpc.json -w '%{http_code}' --max-time 60 \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/update_expired_pending_payments" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')"

          echo "RPC HTTP ${status}"
          cat /tmp/rpc.json; echo

          if [ "$status" != "200" ]; then
            echo "RPC failed — Edge Function fallback..."
            status="$(curl -sS -o /tmp/fn.json -w '%{http_code}' --max-time 60 \
              -X POST "${SUPABASE_URL}/functions/v1/update-expired-payments" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json")"
            echo "Edge HTTP ${status}"
            cat /tmp/fn.json; echo
            test "$status" = "200"
            grep -q '"success":true' /tmp/fn.json
          fi
